[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnsdk"
version = "0.1.0"
description = "Dependency-free ctypes consumer for the Ghidra native SDK"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}

[tool.setuptools]
packages = ["gnsdk"]
